[project]
name = "potemkeys"
version = "2.0.0"
description = "On-screen keyboard-to-controller button map for fighting games"
authors = [{name = "henryfbp", email = "HenryFBP@gmail.com"}]
readme = "README.md"
keywords = ["pygame", "fighting-game", "tekken", "guilty-gear-strive", "input-display"]
requires-python = ">=3.9"
dependencies = [
    "json5>=0.9.6",
    "pygame-ce>=2.5",
    "pynput>=1.8",
]

[project.scripts]
potemkeys = "potemkeys.app:main"

[project.urls]
Homepage = "https://github.com/henryfbp/potemkeys"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyinstaller",
    "macholib; sys_platform == 'darwin'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["potemkeys/*"]
exclude = ["potemkeys/tests"]

[tool.pytest.ini_options]
testpaths = ["potemkeys/tests"]
